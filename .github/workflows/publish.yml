name: Publish package on tag

on:
  push:
    tags:
      - 'spot-price@v*'
      - 'premium-calc@v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - name: Resolve target package from tag
        id: pkg
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag%@v*}"
          echo "dir=packages/${name}" >> "$GITHUB_OUTPUT"
      - run: npm run build --workspace "@agaudeals/${{ github.ref_name }}" || npm -w "${{ steps.pkg.outputs.dir }}" run build
      - run: npm test --workspace "${{ steps.pkg.outputs.dir }}"
      - run: npm publish --provenance --access public
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
